name: Validate marketplace

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Validate registries and generated files
        run: |
          python3 .agents/skills/skill-maintainer/scripts/skill_manager.py validate
          python3 .agents/skills/skill-maintainer/scripts/skill_manager.py render-catalog --apply
          git diff --exit-code
      - name: Run maintenance regression tests
        run: python3 .agents/skills/skill-maintainer/scripts/test_skill_manager.py
      - name: Signal a new Matt upstream commit
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 .agents/skills/skill-maintainer/scripts/skill_manager.py check-upstream --source mattpocock --require-current

  codex-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install the pinned verified Codex runtime
        run: npm install --global @openai/codex@0.153.4
      - name: Verify nested plugin discovery and installation
        run: python3 .agents/skills/skill-maintainer/scripts/verify_codex_plugin.py
